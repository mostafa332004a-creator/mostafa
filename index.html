<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة آسر - نسخة مبسطة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <style>
        body{font-family:sans-serif;background:#f0f4f8}
        .hidden{display:none}
        .glass{background:rgba(255,255,255,.95);backdrop-filter:blur(12px)}
        .status-badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
        .status-active{background:#d1fae5;color:#065f46}
        .status-inactive{background:#f1f5f9;color:#64748b}
        .action-btn{padding:2px 8px;border-radius:6px;font-size:12px;cursor:pointer;border:none}
        .del-btn{background:#fee2e2;color:#dc2626}
        .edit-btn{background:#dbeafe;color:#1d4ed8}
        .firebase-status{position:fixed;bottom:10px;right:10px;padding:4px 12px;border-radius:20px;font-size:10px;z-index:999;background:#22c55e;color:white}
        .firebase-status.offline{background:#ef4444}
    </style>
</head>
<body>

    <div id="fbStatus" class="firebase-status">🟢 متصل</div>

    <!-- LOGIN -->
    <div id="login" class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 flex items-center justify-center p-4">
        <div class="glass rounded-2xl shadow-2xl w-full max-w-md p-8">
            <h1 class="text-2xl font-bold text-center mb-6">🔐 شركة آسر</h1>
            <div class="space-y-4">
                <input id="ln" placeholder="اسم المستخدم" class="w-full border p-3 rounded-xl">
                <input id="lp" type="password" placeholder="الرقم السري" class="w-full border p-3 rounded-xl">
                <button id="btnIn" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">تسجيل الدخول</button>
                <p id="err" class="text-red-500 text-xs text-center hidden">بيانات غير صحيحة</p>
            </div>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="admin" class="hidden min-h-screen bg-slate-50">
        <header class="bg-slate-900 text-white p-4">
            <div class="max-w-7xl mx-auto flex justify-between">
                <h1 class="font-bold">👑 لوحة التحكم</h1>
                <button onclick="logout()" class="bg-white/10 px-3 py-1 rounded">🚪 خروج</button>
            </div>
        </header>

        <nav class="bg-white shadow p-2 flex gap-2">
            <button data-t="team" class="tab active px-4 py-2 rounded bg-blue-600 text-white">👥 الفريق</button>
            <button data-t="clients" class="tab px-4 py-2 rounded hover:bg-slate-100">👤 العملاء</button>
        </nav>

        <main class="max-w-7xl mx-auto p-4">
            <!-- Team -->
            <section id="s-team">
                <div class="bg-white rounded-2xl shadow border p-5">
                    <div class="flex justify-between mb-4">
                        <h2 class="font-bold">👥 فريق العمل</h2>
                        <button id="aEmp" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">➕ موظف</button>
                    </div>
                    <div id="teamList"></div>
                </div>
            </section>

            <!-- Clients -->
            <section id="s-clients" class="hidden">
                <div class="bg-white rounded-2xl shadow border p-5">
                    <div class="flex justify-between mb-4">
                        <h2 class="font-bold">👤 العملاء</h2>
                        <button id="aCli" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm">➕ عميل</button>
                    </div>
                    <div id="clientList"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- EMPLOYEE -->
    <div id="employee" class="hidden min-h-screen bg-slate-50">
        <header class="bg-blue-700 text-white p-4">
            <div class="max-w-6xl mx-auto flex justify-between">
                <div><span class="text-xs">👤 مرحبا</span><div class="font-bold" id="eName"></div></div>
                <button onclick="logout()" class="bg-white/10 px-3 py-1 rounded">خروج</button>
            </div>
        </header>
        <main class="max-w-6xl mx-auto p-4">
            <div class="bg-white rounded-2xl shadow border p-5">
                <h2 class="font-bold mb-3">📋 طلباتي</h2>
                <div id="empRequests"></div>
            </div>
        </main>
    </div>

    <!-- CLIENT -->
    <div id="client" class="hidden min-h-screen bg-slate-50">
        <header class="bg-emerald-700 text-white p-4">
            <div class="max-w-4xl mx-auto flex justify-between">
                <div><span class="text-xs">🏢 أهلاً</span><div class="font-bold" id="cName"></div></div>
                <button onclick="logout()" class="bg-white/10 px-3 py-1 rounded">خروج</button>
            </div>
        </header>
        <main class="max-w-4xl mx-auto p-4">
            <div class="bg-white rounded-2xl shadow border p-5">
                <h2 class="font-bold mb-3">📋 طلباتي</h2>
                <div id="clientRequests"></div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-5">
            <h3 id="mt" class="font-bold text-lg mb-3"></h3>
            <div id="mb"></div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="mc" class="px-4 py-2 bg-slate-100 rounded-xl">إلغاء</button>
                <button id="ms" class="px-4 py-2 bg-blue-600 text-white rounded-xl">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        // =============================================
        // FIREBASE
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyAxbhxYORdyOSDvGeIh-1wCuzW3fxRkuj0",
            authDomain: "user-b11b0.firebaseapp.com",
            projectId: "user-b11b0",
            storageBucket: "user-b11b0.firebasestorage.app",
            messagingSenderId: "87728131796",
            appId: "1:87728131796:web:73114dedc0f164849c3541"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Enable offline
        db.enablePersistence({ synchronizeTabs: true })
            .then(() => console.log('✅ Offline mode enabled'))
            .catch(err => console.warn('⚠️ Persistence error:', err));

        // =============================================
        // STATE
        // =============================================
        let cur = null,
            curId = null;
        const $ = s => document.querySelector(s);

        const data = {
            team: [],
            clients: [],
            requests: []
        };

        // =============================================
        // REAL-TIME LISTENERS
        // =============================================
        // TEAM - with automatic UI update
        db.collection('team').onSnapshot(snapshot => {
            data.team = [];
            snapshot.forEach(doc => data.team.push({ id: doc.id, ...doc.data() }));
            console.log('👥 Team updated:', data.team.length);
            renderTeam();
            renderClients(); // Clients need team data
        }, error => {
            console.error('Team error:', error);
            document.getElementById('fbStatus').className = 'firebase-status offline';
            document.getElementById('fbStatus').textContent = '🔴 غير متصل';
        });

        // CLIENTS - with automatic UI update
        db.collection('clients').onSnapshot(snapshot => {
            data.clients = [];
            snapshot.forEach(doc => data.clients.push({ id: doc.id, ...doc.data() }));
            console.log('👤 Clients updated:', data.clients.length);
            renderClients();
            renderTeam(); // Team needs client data for commissions
        }, error => {
            console.error('Clients error:', error);
            document.getElementById('fbStatus').className = 'firebase-status offline';
            document.getElementById('fbStatus').textContent = '🔴 غير متصل';
        });

        // REQUESTS
        db.collection('requests').onSnapshot(snapshot => {
            data.requests = [];
            snapshot.forEach(doc => data.requests.push({ id: doc.id, ...doc.data() }));
            console.log('📋 Requests updated:', data.requests.length);
            renderRequests();
        }, error => {
            console.error('Requests error:', error);
        });

        // =============================================
        // RENDER FUNCTIONS
        // =============================================

        function renderTeam() {
            const container = document.getElementById('teamList');
            if (!container) return;
            if (cur?.role !== 'admin') return;

            container.innerHTML = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b">
                            <th class="p-2 text-right">الاسم</th>
                            <th class="p-2 text-right">الباسورد</th>
                            <th class="p-2 text-right">الراتب</th>
                            <th class="p-2 text-right">الحالة</th>
                            <th class="p-2"></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.team.map(t => {
                            const clients = data.clients.filter(c => c.assignedEmployeeId === t.id);
                            const salary = clients.reduce((s, c) => s + (Number(c.commission) || 0), 0);
                            const status = t.status || 'inactive';
                            return `
                                <tr class="border-b hover:bg-slate-50">
                                    <td class="p-2 font-semibold">${t.name}</td>
                                    <td class="p-2 text-xs">${t.password}</td>
                                    <td class="p-2 text-green-700 font-semibold">${salary} ج</td>
                                    <td class="p-2"><span class="status-badge ${status === 'active' ? 'status-active' : 'status-inactive'}">${status === 'active' ? '🟢 نشط' : '🔴 غير نشط'}</span></td>
                                    <td class="p-2">
                                        <button onclick="deleteDoc('team','${t.id}')" class="action-btn del-btn">🗑️</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderClients() {
            const container = document.getElementById('clientList');
            if (!container) return;
            if (cur?.role !== 'admin') return;

            container.innerHTML = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b">
                            <th class="p-2 text-right">الاسم</th>
                            <th class="p-2 text-right">الباسورد</th>
                            <th class="p-2 text-right">الموظف</th>
                            <th class="p-2 text-right">العمولة</th>
                            <th class="p-2 text-right">الحالة</th>
                            <th class="p-2"></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.clients.map(c => {
                            const emp = data.team.find(e => e.id === c.assignedEmployeeId);
                            const status = c.status || 'inactive';
                            return `
                                <tr class="border-b hover:bg-slate-50">
                                    <td class="p-2 font-semibold">${c.name}</td>
                                    <td class="p-2 text-xs">${c.password}</td>
                                    <td class="p-2">
                                        <select onchange="assignEmployee('${c.id}', this.value)" class="border rounded px-2 py-1 text-xs">
                                            <option value="">-</option>
                                            ${data.team.map(e => `<option ${c.assignedEmployeeId === e.id ? 'selected' : ''} value="${e.id}">${e.name}</option>`).join('')}
                                        </select>
                                    </td>
                                    <td class="p-2"><input type="number" class="w-20 border rounded px-2 py-1 text-xs" value="${c.commission || 0}" onchange="updateCommission('${c.id}', this.value)"></td>
                                    <td class="p-2"><span class="status-badge ${status === 'active' ? 'status-active' : 'status-inactive'}">${status === 'active' ? '🟢 نشط' : '🔴 غير نشط'}</span></td>
                                    <td class="p-2">
                                        <button onclick="deleteDoc('clients','${c.id}')" class="action-btn del-btn">🗑️</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderRequests() {
            // Employee requests
            if (cur?.role === 'employee') {
                const container = document.getElementById('empRequests');
                if (!container) return;
                const reqs = data.requests.filter(r => r.employeeName === cur.name);
                container.innerHTML = reqs.map(r => `
                    <div class="border-b p-2 flex justify-between">
                        <span>${r.clientName} - ${r.type}</span>
                        <span class="text-green-700 font-bold">${r.amount} ج</span>
                    </div>
                `).join('') || '<p class="text-slate-500">لا توجد طلبات</p>';
            }

            // Client requests
            if (cur?.role === 'client') {
                const container = document.getElementById('clientRequests');
                if (!container) return;
                const reqs = data.requests.filter(r => r.clientName === cur.name);
                container.innerHTML = reqs.map(r => `
                    <div class="border-b p-2 flex justify-between">
                        <span>${r.type}</span>
                        <span class="text-green-700 font-bold">${r.amount} ج</span>
                        <span>${r.employeeName || '-'}</span>
                    </div>
                `).join('') || '<p class="text-slate-500">لا توجد طلبات</p>';
            }
        }

        // =============================================
        // ACTIONS
        // =============================================

        // Add Employee
        document.getElementById('aEmp')?.addEventListener('click', () => {
            openModal('➕ موظف جديد',
                `
                <div class="space-y-2">
                    <input id="e1" placeholder="الاسم" class="w-full border p-2 rounded-xl">
                    <input id="e2" placeholder="كلمة السر" class="w-full border p-2 rounded-xl">
                </div>
                `,
                () => {
                    const name = document.getElementById('e1').value.trim();
                    const pass = document.getElementById('e2').value.trim();
                    if (!name || !pass) { alert('⚠️ يرجى ملء جميع الحقول'); return; }
                    db.collection('team').add({
                        name: name,
                        password: pass,
                        status: 'inactive',
                        lastActive: new Date().toISOString()
                    }).then(() => {
                        alert('✅ تم إضافة الموظف بنجاح!');
                        closeModal();
                    }).catch(err => {
                        console.error('Error:', err);
                        alert('❌ حدث خطأ: ' + err.message);
                    });
                }
            );
        });

        // Add Client
        document.getElementById('aCli')?.addEventListener('click', () => {
            openModal('➕ عميل جديد',
                `
                <div class="space-y-2">
                    <input id="c1" placeholder="اسم العميل" class="w-full border p-2 rounded-xl">
                    <input id="c2" placeholder="كلمة السر" class="w-full border p-2 rounded-xl">
                </div>
                `,
                () => {
                    const name = document.getElementById('c1').value.trim();
                    const pass = document.getElementById('c2').value.trim();
                    if (!name || !pass) { alert('⚠️ يرجى ملء جميع الحقول'); return; }
                    db.collection('clients').add({
                        name: name,
                        password: pass,
                        assignedEmployeeId: '',
                        commission: 0,
                        status: 'inactive',
                        lastActive: new Date().toISOString()
                    }).then(() => {
                        alert('✅ تم إضافة العميل بنجاح!');
                        closeModal();
                    }).catch(err => {
                        console.error('Error:', err);
                        alert('❌ حدث خطأ: ' + err.message);
                    });
                }
            );
        });

        // Delete document
        window.deleteDoc = (collection, id) => {
            if (!confirm('هل تريد حذف هذا العنصر؟')) return;
            db.collection(collection).doc(id).delete()
                .then(() => console.log('🗑️ Deleted'))
                .catch(err => console.error('Error:', err));
        };

        // Assign employee to client
        window.assignEmployee = (clientId, empId) => {
            db.collection('clients').doc(clientId).update({ assignedEmployeeId: empId })
                .catch(err => console.error('Error:', err));
        };

        // Update commission
        window.updateCommission = (clientId, value) => {
            db.collection('clients').doc(clientId).update({ commission: Number(value) || 0 })
                .catch(err => console.error('Error:', err));
        };

        // =============================================
        // MODAL
        // =============================================
        function openModal(title, html, onSave) {
            document.getElementById('mt').textContent = title;
            document.getElementById('mb').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            document.getElementById('ms').onclick = onSave;
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        document.getElementById('mc')?.addEventListener('click', closeModal);

        // =============================================
        // LOGIN
        // =============================================
        function handleLogin() {
            const n = document.getElementById('ln').value.trim();
            const p = document.getElementById('lp').value.trim();

            if (n.toLowerCase() === 'mostafa' && p === '332004') {
                cur = { role: 'admin' };
                show('admin');
                renderTeam();
                renderClients();
                return;
            }

            const emp = data.team.find(t => t.name && t.name.toLowerCase() === n.toLowerCase() && t.password === p);
            if (emp) {
                cur = { role: 'employee', ...emp };
                curId = emp.id;
                show('employee');
                document.getElementById('eName').textContent = emp.name;
                renderRequests();
                return;
            }

            const cli = data.clients.find(c => c.name && c.name.toLowerCase() === n.toLowerCase() && c.password === p);
            if (cli) {
                cur = { role: 'client', ...cli };
                curId = cli.id;
                show('client');
                document.getElementById('cName').textContent = cli.name;
                renderRequests();
                return;
            }

            document.getElementById('err').classList.remove('hidden');
            setTimeout(() => document.getElementById('err').classList.add('hidden'), 3000);
        }

        document.getElementById('btnIn')?.addEventListener('click', handleLogin);
        document.getElementById('ln')?.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
        document.getElementById('lp')?.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

        // =============================================
        // LOGOUT
        // =============================================
        function logout() {
            // Set user inactive
            if (cur && curId) {
                const col = cur.role === 'employee' ? 'team' : 'clients';
                db.collection(col).doc(curId).update({
                    status: 'inactive',
                    lastActive: new Date().toISOString()
                }).catch(() => {});
            }
            location.reload();
        }

        // =============================================
        // SHOW
        // =============================================
        function show(v) {
            ['login', 'admin', 'employee', 'client'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(v).classList.remove('hidden');
        }

        // =============================================
        // TABS
        // =============================================
        document.querySelectorAll('.tab').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => {
                    x.classList.remove('bg-blue-600', 'text-white');
                });
                b.classList.add('bg-blue-600', 'text-white');
                document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
                document.getElementById('s-' + b.dataset.t).classList.remove('hidden');
            };
        });

        // =============================================
        // STATUS
        // =============================================
        // Update online status
        db.collection('test').onSnapshot(
            () => {
                document.getElementById('fbStatus').className = 'firebase-status';
                document.getElementById('fbStatus').textContent = '🟢 متصل';
            },
            () => {
                document.getElementById('fbStatus').className = 'firebase-status offline';
                document.getElementById('fbStatus').textContent = '🔴 غير متصل';
            }
        );

        console.log('🔥 Firebase connected!');
        console.log('🔑 Admin: mostafa / 332004');
        console.log('📱 Open on multiple devices - changes sync instantly!');
    </script>
</body>
</html>
